<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Receipt Scanner</title>

  <!-- Startup diagnostics -->
  <script>
    window.__listReady = false;      
    window.__stage = 'starting';     
    window.__problemShown = false;   

    var DB_NAME = 'ScanlineReceiptsDB';
    var DB_VERSION = 10; // Matches existing browser database version

    var __shown = {};
    var __diagPre = null;
    var __boxCleared = false;

    function problemBox() {
      var el = document.getElementById('receiptList');
      if (!el || window.__listReady) return null;
      if (!__boxCleared) { el.textContent = ''; __boxCleared = true; }
      return el;
    }

    function showListProblem(msg) {
      var el = problemBox();
      if (!el || __shown[msg]) return;
      __shown[msg] = true;
      window.__problemShown = true;
      var p = document.createElement('p');
      p.style.cssText = 'color:#d9534f;font-size:14px;margin:0 0 8px;';
      p.textContent = msg;
      el.appendChild(p);
    }

    function diag(line) {
      var el = problemBox();
      if (!el) return;
      if (!__diagPre) {
        __diagPre = document.createElement('pre');
        __diagPre.style.cssText = 'font-size:12px;white-space:pre-wrap;word-break:break-word;color:#444;background:#f3f3f3;padding:8px;border-radius:6px;margin:0;';
        el.appendChild(__diagPre);
      }
      __diagPre.textContent += line + '\n';
    }

    function errText(e) {
      if (!e) return 'unknown error';
      var t = (e.name ? e.name + ': ' : '') + (e.message || String(e));
      if (e.inner) t += ' (' + errText(e.inner) + ')';
      return t;
    }

    window.addEventListener('error', function (e) {
      showListProblem('Startup error: ' + (e.message || 'unknown error') + (e.lineno ? ' (line ' + e.lineno + ')' : ''));
    });

    window.addEventListener('unhandledrejection', function (e) {
      showListProblem('Startup error: ' + errText(e.reason));
    });

    function race(makePromise, ms) {
      return new Promise(function (resolve) {
        var finished = false;
        var timer = setTimeout(function () {
          if (!finished) { finished = true; resolve({ state: 'timeout' }); }
        }, ms);
        var p;
        try { p = makePromise(); } catch (e) { p = Promise.reject(e); }
        Promise.resolve(p).then(
          function (v) { if (!finished) { finished = true; clearTimeout(timer); resolve({ state: 'ok', value: v }); } },
          function (e) { if (!finished) { finished = true; clearTimeout(timer); resolve({ state: 'error', error: e }); } }
        );
      });
    }

    function probeIndexedDB() {
      return new Promise(function (resolve, reject) {
        var t0 = Date.now();
        var req = window.indexedDB.open('receipt_probe_db', 1);
        req.onupgradeneeded = function () { req.result.createObjectStore('t'); };
        req.onsuccess = function () {
          req.result.close();
          try { window.indexedDB.deleteDatabase('receipt_probe_db'); } catch (e) {}
          resolve(Date.now() - t0);
        };
        req.onerror = function () { reject(req.error || new Error('open failed')); };
        req.onblocked = function () { reject(new Error('blocked by another connection')); };
      });
    }

    function listDatabases() {
      return window.indexedDB.databases ? window.indexedDB.databases() : Promise.resolve(null);
    }

    function storageEstimate() {
      return (navigator.storage && navigator.storage.estimate) ? navigator.storage.estimate() : Promise.resolve(null);
    }

    function mb(n) { return (n / 1048576).toFixed(1); }

    function runProbes() {
      var idbState = 'unknown';
      race(probeIndexedDB, 4000).then(function (r) {
        idbState = r.state;
        if (r.state === 'ok') diag('Browser IndexedDB test: OK (' + r.value + ' ms)');
        else if (r.state === 'timeout') diag('Browser IndexedDB test: no response after 4 s');
        else diag('Browser IndexedDB test: FAILED - ' + errText(r.error));
        return race(listDatabases, 3000);
      }).then(function (r) {
        if (r.state === 'ok' && r.value) {
          var names = r.value.map(function (d) { return d.name + ' (v' + d.version + ')'; });
          diag('Databases here: ' + (names.join(', ') || 'none') + '. This app expects ' + DB_NAME + ' at v' + DB_VERSION + '.');
        } else if (r.state === 'timeout') {
          diag('Database list: no response after 3 s');
        } else if (r.state === 'error') {
          diag('Database list: failed - ' + errText(r.error));
        } else {
          diag('Database list: not supported by this browser');
        }
        return race(storageEstimate, 3000);
      }).then(function (r) {
        if (r.state === 'ok' && r.value) {
          diag('Storage: ' + mb(r.value.usage) + ' MB used of ' + mb(r.value.quota) + ' MB');
        }
        var stage = window.__stage;
        if (window.__listReady) return;
        if (typeof Dexie === 'undefined') {
          diag('=> The Dexie library did not load. Check your internet connection and reload.');
        } else if (idbState === 'timeout' || idbState === 'error') {
          diag("=> This browser's IndexedDB is not working on this page. Try Chrome or Firefox at the same address.");
        } else if (stage === 'starting') {
          diag('=> The app script has not started yet. Is the Dexie library still downloading?');
        } else if (stage === 'opening database') {
          diag("=> The browser's IndexedDB works, but this app's database is not opening. It may be held by another open copy of the app, or damaged.");
        } else if (stage === 'reading receipts') {
          diag('=> The database opened, but reading the saved receipts is taking very long (many large photos?).');
        }
      });
    }

    setTimeout(function () {
      if (window.__listReady) return;
      diag(window.__problemShown ? 'Diagnostics after 6 s:' : 'Still loading after 6 s.');
      diag('Step: ' + window.__stage);
      diag('Page: ' + location.protocol + '//' + location.host + (window.isSecureContext ? ' (secure)' : ' (not secure)'));
      diag('Dexie library: ' + (typeof Dexie === 'undefined' ? 'NOT loaded' : 'loaded'));
      diag('IndexedDB: ' + (window.indexedDB ? 'present' : 'MISSING'));
      diag('Browser: ' + navigator.userAgent);
      if (location.protocol === 'file:' || location.protocol === 'content:') {
        diag('=> Opened as a local file. Host it (Netlify Drop, GitHub Pages) and open the https address instead.');
      }
      if (!window.indexedDB) return;
      runProbes();
    }, 6000);
  </script>

<body>

  <h2>AI Receipt Scanner</h2>

  <!-- Scan / Upload Inputs -->
  <div class="card" id="scanCard">
    <!-- Hidden file inputs -->
    <input type="file" id="cameraInput" accept="image/*" capture="environment" style="display:none;">
    <input type="file" id="galleryInput" accept="image/*" style="display:none;">

    <button type="button" onclick="document.getElementById('cameraInput').click()">Capture Receipt</button>
    <button type="button" class="secondary" onclick="document.getElementById('galleryInput').click()">Upload Receipt</button>

    <p id="status" style="color: #666; font-size: 14px; margin-bottom: 0;"></p>

    <!-- Rescan Error Container -->
    <div id="errorBox" class="error-container">
      <div id="errorMessage" class="error-text"></div>
      <button type="button" onclick="rescanLastImage()">🔄 Try Again (Rescan)</button>
    </div>
  </div>

  <!-- Review, Actions & Edit Form -->
  <div class="card" id="receiptFormCard" style="display:none;">
    <h3>Review AI Scan</h3>
    
    <div class="preview-container">
      <img id="imagePreview" class="preview" alt="Receipt preview">
    </div>

    <form id="receiptForm" style="margin-top: 16px;">
      <div class="result-field">
        <label>Vendor Name:</label>
        <input type="text" id="vendor" placeholder="e.g. Target, Shell, Walmart" required oninput="checkRefundCondition()">
      </div>
      <div class="result-field">
        <label>Category:</label>
        <select id="category">
          <option value="Gas">Gas</option>
          <option value="Merchandise">Merchandise</option>
          <option value="Restaurants">Restaurants</option>

          <option value="Refund">Refund</option>
          <option value="Other">Other</option>
        </select>
      </div>
      <div class="result-field">
        <label>Date of Purchase (MM/DD/YYYY):</label>
        <input type="text" id="date" placeholder="MM/DD/YYYY" required>
      </div>
      <div class="result-field">
        <label>Total Cost ($):</label>

    <!-- Automatic Redundancy Banner -->

    <!-- Search -->
    <div class="search-wrap">

  <!-- Modal for Viewing Saved Receipt Image -->
  <div id="receiptModal" class="modal" onclick="closeModal(event)">
    <div class="modal-content" onclick="event.stopPropagation()">
      <span class="close-btn" onclick="closeModal()">&times;</span>
      <h3 id="modalVendor" style="margin-top:0;">Vendor</h3>

      </div>
      <button type="button" class="secondary" style="margin-top:15px;" onclick="closeModal()">Close</button>

  <script>
    const API_KEY = "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";

    const db = new Dexie(DB_NAME);
    db.version(DB_VERSION).stores({
      receipts: '++id, vendor, category, date, total, paymentMethod, createdAt'
    });

    db.on('blocked', () => {
      showListProblem('The database is blocked by another open copy of this app. Close other tabs or windows, then reload.');
    });

    let currentImageData = null;
    let duplicateIds = new Set();

    // Automatic duplicate detector: checks database and updates state automatically
    async function updateDuplicateStatus(allReceipts) {
      const banner = document.getElementById('duplicateBanner');
      duplicateIds.clear();

      if (!allReceipts || allReceipts.length < 2) {
        banner.style.display = 'none';
        return;
      }

      const groups = {};
      allReceipts.forEach(r => {
        const normVendor = (r.vendor || '').trim().toLowerCase();
        const normDate = (r.date || '').trim();
        const normTotal = parseFloat(r.total || 0).toFixed(2);
        const key = `${normVendor}|${normDate}|${normTotal}`;

        if (!groups[key]) groups[key] = [];
        groups[key].push(r.id);
      });

      Object.values(groups).forEach(idGroup => {
        if (idGroup.length > 1) {
          idGroup.forEach(id => duplicateIds.add(id));
        }
      });

      if (duplicateIds.size > 0) {
        banner.style.display = 'block';
        banner.innerHTML = `⚠️ Found <strong>${duplicateIds.size}</strong> matching potential redundant entries highlighted below.`;
      } else {
        banner.style.display = 'none';
      }
    }

    const cameraInput = document.getElementById('cameraInput');
    const galleryInput = document.getElementById('galleryInput');
    const status = document.getElementById('status');
    const errorBox = document.getElementById('errorBox');
    const errorMessage = document.getElementById('errorMessage');
    const receiptFormCard = document.getElementById('receiptFormCard');
    const imagePreview = document.getElementById('imagePreview');
    const searchInput = document.getElementById('searchInput');
    const searchClear = document.getElementById('searchClear');
    const searchCount = document.getElementById('searchCount');
    const sortSelect = document.getElementById('sortSelect');
    let currentSort = 'date'; 

    window.__stage = 'opening database';
    db.open().then(() => {
      window.__stage = 'reading receipts';
      displaySavedReceipts();
    }).catch(err => {
      window.__stage = 'open failed';
      console.error("Failed to open DB:", err);
      showListProblem("Database could not be opened: " + errText(err));
    });

    // Search
    let searchTimer = null;

    searchInput.addEventListener('input', () => {
      searchClear.style.display = searchInput.value ? 'block' : 'none';
      clearTimeout(searchTimer);
      searchTimer = setTimeout(displaySavedReceipts, 150);
    });

    searchClear.addEventListener('click', () => {
      searchInput.value = '';
      searchClear.style.display = 'none';
      displaySavedReceipts();
      searchInput.focus();
    });

    // Sort
    sortSelect.addEventListener('change', () => {
      currentSort = sortSelect.value;
      displaySavedReceipts();
    });

    function getSearchTerms() {
      return searchInput.value.toLowerCase().trim().split(/\s+/).filter(Boolean);
    }

    function formatTotal(v) {
      const n = Number(v);
      return isNaN(n) ? 'N/A' : n.toFixed(2);
    }

    const MONTH_YEAR = /^(\d{1,2})\/(\d{4})$/;

    function matchesSearch(r, terms) {
      if (terms.length === 0) return true;
      const total = formatTotal(r.total);
      const haystack = [
        r.vendor,
        r.category,
        r.paymentMethod,
        r.date,
        total,
        '$' + total
      ].join(' ').toLowerCase();
      const d = /^(\d{1,2})\/(\d{1,2})\/(\d{4})$/.exec((r.date || '').trim());
      return terms.every(t => {
        const my = MONTH_YEAR.exec(t);
        if (my) return !!(d && Number(my[1]) === Number(d[1]) && my[2] === d[3]);
        return haystack.includes(t);
      });
    }

    function escapeHtml(str) {
      return String(str ?? '').replace(/[&<>"']/g, c => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      }[c]));
    }

    function escapeRegExp(str) {
      return str.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    }

    function highlight(text, terms) {
      const safe = escapeHtml(text);
      terms = terms.filter(t => !MONTH_YEAR.test(t));
      if (terms.length === 0) return safe;
      const pattern = terms.map(t => escapeRegExp(escapeHtml(t))).join('|');
      return safe.replace(new RegExp('(' + pattern + ')', 'gi'), '<mark>$1</mark>');
    }

    // Sorting
    function dateToSortValue(str) {
      const m = /^(\d{1,2})\/(\d{1,2})\/(\d{4})$/.exec((str || '').trim());
      if (!m) return null;
      return new Date(+m[3], +m[1] - 1, +m[2]).getTime();
    }

    function byScanTimeDesc(a, b) {
      return new Date(b.createdAt) - new Date(a.createdAt);
    }

    function compareByDateDesc(a, b) {
      const dateA = dateToSortValue(a.date);
      const dateB = dateToSortValue(b.date);
      if (dateA === null && dateB === null) return byScanTimeDesc(a, b);
      if (dateA === null) return 1;
      if (dateB === null) return -1;
      if (dateA !== dateB) return dateB - dateA;
      return byScanTimeDesc(a, b);
    }

    function sortByDate(list) {
      return list.sort(compareByDateDesc);
    }

    function sortByText(list, field) {
      return list.sort((a, b) => {
        const valA = (a[field] || '').toLowerCase();
        const valB = (b[field] || '').toLowerCase();
        if (!valA && !valB) return compareByDateDesc(a, b);
        if (!valA) return 1;
        if (!valB) return -1;
        if (valA !== valB) return valA < valB ? -1 : 1;
        return compareByDateDesc(a, b);
      });
    }

    function sortReceipts(list, key) {
      if (key === 'vendor') return sortByText(list, 'vendor');
      if (key === 'payment') return sortByText(list, 'paymentMethod');
      if (key === 'category') return sortByText(list, 'category');
      return sortByDate(list);
    }

    // Scanning / Uploading
    async function handleFileSelect(e) {
      const file = e.target.files[0];
      if (!file) return;

      errorBox.style.display = "none";
      status.innerText = "⏳ Preparing photo...";
      receiptFormCard.style.display = "none";

      try {
        const resizedBase64 = await resizeImage(file, 1200, 1200);
        currentImageData = resizedBase64;
        imagePreview.src = currentImageData;

        await executeAIScan();
      } catch (err) {
        showError(err.message || "Failed to process photo.");
      }
    }

    cameraInput.addEventListener('change', handleFileSelect);
    galleryInput.addEventListener('change', handleFileSelect);

    async function rescanLastImage() {
      if (!currentImageData) return;
      errorBox.style.display = "none";
      await executeAIScan();
    }

    async function executeAIScan() {
      status.innerText = "🤖 AI reading receipt & handwritten notes...";
      try {
        await parseWithAI(currentImageData, API_KEY);
        status.innerText = "";
        errorBox.style.display = "none";
        receiptFormCard.style.display = "block";
      } catch (err) {
        status.innerText = "";
        showError("AI Scan error: " + (err.message || "Check network connection."));
        console.error(err);
      }
    }

    function showError(msg) {
      errorMessage.innerText = msg;
      errorBox.style.display = "block";
    }

    function resizeImage(file, maxWidth, maxHeight) {
      return new Promise((resolve, reject) => {
        const img = new Image();
        img.src = URL.createObjectURL(file);
        img.onload = () => {
          let width = img.width;
          let height = img.height;

          if (width > maxWidth || height > maxHeight) {
            const ratio = Math.min(maxWidth / width, maxHeight / height);
            width = Math.round(width * ratio);
            height = Math.round(height * ratio);
          }

          const canvas = document.createElement('canvas');
          canvas.width = width;
          canvas.height = height;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, width, height);

          resolve(canvas.toDataURL('image/jpeg', 0.85));
        };
        img.onerror = (err) => reject(err);
      });
    }

    async function parseWithAI(base64Image, apiKey) {
      const prompt = `
        Analyze this receipt image and extract these 5 fields in valid JSON format only:
        1. "vendor": Vendor or store name (string).
        2. "category": Strictly select one of these categories: "Gas", "Merchandise", "Restaurants", "Groceries", "Refund", or "Other". If the total cost is negative OR the word "refund" appears anywhere on the receipt, set "category" strictly to "Refund".
        3. "date": Date of purchase in MM/DD/YYYY format (string). Convert written months like Sep/September to numbers.
        4. "total": The FINAL total cost as a number (float). Express refunds or returns as negative numbers (e.g. -15.50).
        5. "paymentMethod": Must be strictly one of these values: "OnePay", "Discover", "Visa", "Mastercard", "Amex", "Debit Card", "Cash", or "Other". Look for card names or explicit payment text (such as ONEPAY). Do NOT default ONEPAY to Discover.

        Return ONLY raw JSON object like this:
        {"vendor": "Hanako", "category": "Restaurants", "date": "09/18/2026", "total": 32.00, "paymentMethod": "OnePay"}
      `;

      // Active Groq Vision Model
      const response = await fetch("https://api.groq.com/openai/v1/chat/completions", {
        method: "POST",
        headers: { 
          "Content-Type": "application/json",
          "Authorization": `Bearer ${apiKey}`
        },
        body: JSON.stringify({
          model: "qwen/qwen3.8-27b",
          messages: [
            {
              role: "user",
              content: [
                { type: "text", text: prompt },
                {
                  type: "image_url",
                  image_url: {
                    url: base64Image
                  }
                }
              ]
            }
          ],
          response_format: { type: "json_object" }
        })
      });

      if (!response.ok) {
        const errData = await response.json().catch(() => ({}));
        const msg = errData?.error?.message || `HTTP ${response.status}`;
        throw new Error(msg);
      }

      const data = await response.json();
      let rawText = data.choices[0].message.content;
      
      let text = rawText.replace(/```json/g, '').replace(/```/g, '').trim();
      const parsed = JSON.parse(text);

      const vendorVal = parsed.vendor || '';
      const totalVal = parsed.total !== undefined && parsed.total !== null ? parseFloat(parsed.total) : NaN;

      document.getElementById('vendor').value = vendorVal;
      document.getElementById('date').value = parsed.date || '';
      document.getElementById('total').value = !isNaN(totalVal) ? totalVal.toFixed(2) : '';

      const categorySelect = document.getElementById('category');
      if (totalVal < 0 || vendorVal.toLowerCase().includes('refund') || (parsed.category && parsed.category.toLowerCase() === 'refund')) {
        categorySelect.value = 'Refund';
      } else if (parsed.category && [...categorySelect.options].some(o => o.value === parsed.category)) {
        categorySelect.value = parsed.category;
      } else {
        categorySelect.value = 'Other';
      }

      const paymentSelect = document.getElementById('paymentMethod');
      if (rawText.toUpperCase().includes('ONEPAY')) {
        paymentSelect.value = 'OnePay';
      } else if (parsed.paymentMethod && [...paymentSelect.options].some(o => o.value === parsed.paymentMethod)) {
        paymentSelect.value = parsed.paymentMethod;
      } else {
        paymentSelect.value = 'Other';
      }
    }

    function checkRefundCondition() {
      const vendorVal = document.getElementById('vendor').value.toLowerCase();
      const totalVal = parseFloat(document.getElementById('total').value);
      const categorySelect = document.getElementById('category');

      if (totalVal < 0 || vendorVal.includes('refund')) {
        categorySelect.value = 'Refund';
      }
    }

    async function saveReceipt() {
      const vendor = document.getElementById('vendor').value;
      const category = document.getElementById('category').value;
      const date = document.getElementById('date').value;
      const total = parseFloat(document.getElementById('total').value);
      const paymentMethod = document.getElementById('paymentMethod').value;

      if (!vendor || isNaN(total)) {
        alert("Please fill in both Vendor and Total.");
        return;
      }

      try {
        await db.receipts.add({
          vendor,
          category,
          date,
          total,
          paymentMethod,
          image: currentImageData,
          createdAt: new Date()
        });

        resetScanForm();
        status.innerText = "🎉 Saved successfully!";
        displaySavedReceipts(); // Triggers re-check & re-render automatically
      } catch (err) {
        alert("Save Error: " + err.message);
        console.error(err);
      }
    }

    function retakePhoto() {
      resetScanForm();
      cameraInput.click();
    }

    function cancelScan() {
      resetScanForm();
      status.innerText = "Scan cancelled.";
    }

    function resetScanForm() {
      receiptFormCard.style.display = "none";
      errorBox.style.display = "none";
      cameraInput.value = "";
      galleryInput.value = "";
      currentImageData = null;
      document.getElementById('vendor').value = "";
      document.getElementById('date').value = "";
      document.getElementById('total').value = "";
      document.getElementById('category').value = "Other";
      document.getElementById('paymentMethod').value = "Other";
    }

    async function displaySavedReceipts() {
      const listContainer = document.getElementById('receiptList');
      try {
        const rawReceipts = await db.receipts.toArray();
        
        // Run duplicate detection automatically whenever data is retrieved
        await updateDuplicateStatus(rawReceipts);

        const allReceipts = sortReceipts(rawReceipts, currentSort);
        window.__stage = 'ready';
        window.__listReady = true;

        if (allReceipts.length === 0) {
          searchCount.innerText = '';
          listContainer.innerHTML = "<p style='color:#777;'>No receipts saved yet.</p>";
          return;
        }

        const terms = getSearchTerms();
        const filtered = allReceipts.filter(r => matchesSearch(r, terms));

        searchCount.innerText = terms.length
          ? `${filtered.length} of ${allReceipts.length} receipts`
          : '';

        if (filtered.length === 0) {
          listContainer.innerHTML = "<p style='color:#777;'>No receipts match your search.</p>";
          return;
        }

        listContainer.innerHTML = filtered.map(r => {
          const pm = (r.paymentMethod || '').toLowerCase();
          const cat = (r.category || '').toLowerCase();
          
          let badgeClass = 'badge-red'; 
          if (cat === 'refund') {
            badgeClass = 'badge-green'; 
          } else if (pm === 'cash') {
            badgeClass = 'badge-blue';  
          }

          const isDup = duplicateIds.has(r.id);
          const dupClass = isDup ? 'duplicate-flag' : '';
          const dupTag = isDup ? `<span class="badge badge-warning">Possible Duplicate</span>` : '';

          return `
            <div class="receipt-item ${dupClass}" onclick="viewReceiptDetail(${r.id})">
              <div class="receipt-info">
                <strong>${highlight(r.vendor, terms)} ${dupTag}</strong>
                <span>$${highlight(formatTotal(r.total), terms)} • ${highlight(r.paymentMethod, terms)}</span><br>
                <span class="badge ${badgeClass}">${highlight(r.category || 'Other', terms)}</span>
                <small style="margin-left:6px;">Date: ${highlight(r.date || 'N/A', terms)}</small>
              </div>
              <button class="danger" onclick="deleteReceipt(event, ${r.id})">Delete</button>
            </div>
          `;
        }).join('');
      } catch (e) {
        window.__stage = 'read failed';
        window.__listReady = true;
        console.error(e);
        listContainer.innerHTML = "<p style='color:#d9534f;'>Error loading data: " + escapeHtml(e.message) + "</p>";
      }
    }

    async function viewReceiptDetail(id) {
      const receipt = await db.receipts.get(id);
      if (!receipt) return;

      document.getElementById('modalVendor').innerText = receipt.vendor;
      document.getElementById('modalDetails').innerText = `$${formatTotal(receipt.total)} • ${receipt.category || 'Other'} • ${receipt.paymentMethod} • ${receipt.date}`;
      
      const modalImg = document.getElementById('modalImage');
      if (receipt.image) {
        modalImg.src = receipt.image;
        modalImg.style.display = 'block';
      } else {
        modalImg.style.display = 'none';
      }

      document.getElementById('receiptModal').style.display = 'block';
    }

    function closeModal(e) {
      document.getElementById('receiptModal').style.display = 'none';
    }

    async function deleteReceipt(event, id) {
      event.stopPropagation();
      if (confirm("Delete this entry?")) {
        await db.receipts.delete(id);
        displaySavedReceipts();
      }
    }
  </script>
</body>
